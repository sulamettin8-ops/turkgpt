<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurkGPT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 16px; text-align: center; font-size: 1.2rem; font-weight: bold; color: #38bdf8; border-bottom: 1px solid #334155; }
        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .user { background-color: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background-color: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        #input-container { display: flex; padding: 12px; background-color: #1e293b; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; outline: none; font-size: 1rem; }
        button { margin-left: 8px; padding: 12px 20px; border-radius: 8px; border: none; background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <header>🤖 TurkGPT</header>

    <div id="chat-box">
        <div class="message bot">Selam! Ben TurkGPT. Sana nasıl yardımcı olabilirim?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Mesajını yaz..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById("chat-box");

            // Kullanıcı mesajını ekrana bas
            const userMsg = document.createElement("div");
            userMsg.className = "message user";
            userMsg.innerText = text;
            chatBox.appendChild(userMsg);

            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // TurkGPT bekleniyor göstergesi
            const botMsg = document.createElement("div");
            botMsg.className = "message bot";
            botMsg.innerText = "Yazıyor...";
            chatBox.appendChild(botMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Backend'e istek at
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                botMsg.innerText = data.response;
            } catch (err) {
                botMsg.innerText = "Bir bağlantı hatası oluştu!";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
